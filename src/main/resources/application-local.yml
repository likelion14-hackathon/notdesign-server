spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: ${OPENAI_CHAT_MODEL:}
        temperature: ${OPENAI_CHAT_TEMPERATURE:}
  datasource:
    url: jdbc:mariadb://${DB_HOST:}:${DB_PORT:}/${DB_NAME:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:}
      port: ${REDIS_PORT:}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true

jwt:
  secret: ${JWT_SECRET_KEY:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

kakao:
  client-id: ${KAKAO_CLIENT_ID:}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  redirect-uri: ${KAKAO_REDIRECT_URI:}

services:
  analyze:
    url: ${SERVICES_ANALYZE_URL:http://localhost:8000}

aws:
  s3:
    # 버킷 이름은 env로 주입. 자격증명은 표준 AWS env(AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY)로 읽는다.
    bucket: ${AWS_S3_BUCKET:}
    region: ${AWS_S3_REGION:ap-northeast-2}

logging:
  level:
    com.likelionknu.notdesign: DEBUG
    org.hibernate.SQL: DEBUG
