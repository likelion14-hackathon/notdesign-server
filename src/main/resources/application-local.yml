spring:
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:not_design}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true

jwt:
  secret: ${JWT_SECRET_KEY:bG9jYWwtb25seS1kZXYtc2VjcmV0LWtleS1mb3Itc3ByaW5nLWluaXRpYWxpemUtZG8tbm90LXVzZS1pbi1wcm9k}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

kakao:
  client-id: ${KAKAO_CLIENT_ID:}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/login/oauth2/code/kakao}

logging:
  level:
    com.likelionknu.notdesign: DEBUG
    org.hibernate.SQL: DEBUG
