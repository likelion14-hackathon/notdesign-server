spring:
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:not_design}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  data:
    redis:
      # 팀 공용 클라우드 Redis(redislabs, db 0)로 통합. 로그인 토큰/블랙리스트 + 분석 결과 공용.
      # 비밀번호는 커밋 금지 — 환경변수(REDIS_PASSWORD)로 주입 (카톡 공유 값).
      host: ${REDIS_HOST:redis-12829.c340.ap-northeast-2-1.ec2.cloud.redislabs.com}
      port: ${REDIS_PORT:12829}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true

jwt:
  secret: ${JWT_SECRET_KEY:bG9jYWwtb25seS1kZXYtc2VjcmV0LWtleS1mb3Itc3ByaW5nLWluaXRpYWxpemUtZG8tbm90LXVzZS1pbi1wcm9k}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

kakao:
  client-id: ${KAKAO_CLIENT_ID:}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/login/oauth2/code/kakao}

logging:
  level:
    com.likelionknu.notdesign: DEBUG
    org.hibernate.SQL: DEBUG
