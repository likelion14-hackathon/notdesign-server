spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        model: ${OPENAI_CHAT_MODEL}
        temperature: ${OPENAI_CHAT_TEMPERATURE}
        max-retries: 0
  datasource:
    url: jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        show_sql: false

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}

jwt:
  secret: ${JWT_SECRET_KEY}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

aws:
  credentials:
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_S3_REGION}

services:
  analyze:
    url: ${SERVICES_ANALYZE_URL}

app:
  ai:
    fallback:
      # 성능 좋은 순. 앞에서부터 시도하고 한도(429)·사용 불가 시 다음 모델로 넘어간다.
      models: ${AI_FALLBACK_MODELS:gpt-5.6-sol,gpt-5.5-pro,gpt-5.6-terra,gpt-5.5,gpt-5.4-pro,gpt-5.4,gpt-5.2,gpt-4.1,gpt-5.4-mini,gpt-4o}

logging:
  level:
    root: INFO
    com.likelionknu.notdesign: INFO
