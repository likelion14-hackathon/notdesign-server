# develop push 시 Docker 이미지 빌드 → GHCR 푸시
name: CI

on:
  push:
    branches: [ develop ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # GHCR 푸시 권한
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3   # 빌드 캐시(gha) 쓰려면 buildx 필요

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}   # 추적·롤백용 커밋 태그
          cache-from: type=gha
          cache-to: type=gha,mode=max
