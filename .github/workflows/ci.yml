# develop push 시 Docker 이미지 빌드 → GHCR 푸시 → 서버 자동 배포(CD)
name: CI

on:
  push:
    branches: [ develop ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # GHCR 푸시 권한
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3   # 빌드 캐시(gha) 쓰려면 buildx 필요

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 태그: latest + 커밋 SHA(추적·롤백)
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 이미지 푸시 후 서버에 SSH 접속 → 최신 이미지로 컨테이너 교체
  deploy:
    needs: build-and-push        # 빌드·푸시 성공해야 배포
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1   # SSH 원격 명령 실행
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # 서버는 사전에 ghcr.io 로그인·/root/proof.env 준비돼 있어야 함
          script: |
            docker pull ghcr.io/${{ github.repository }}:latest
            docker rm -f proof || true       # 기존 컨테이너 제거(없어도 통과)
            docker run -d --name proof \
              --network host \
              --env-file /root/proof.env \
              --restart unless-stopped \
              ghcr.io/${{ github.repository }}:latest
            docker image prune -f            # 이전 이미지 정리(디스크 확보)
